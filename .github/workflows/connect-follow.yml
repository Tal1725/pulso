name: Connect PULSO follow system

on:
  push:
    paths:
      - '.github/workflows/connect-follow.yml'
      - 'assets/js/follow.js'
      - 'assets/js/seguidos.js'

permissions:
  contents: write

jobs:
  connect-follow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect follow and following list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Add "Seguindo" to the desktop/mobile navigation without replacing the existing layout.
          feed = '<a href="#feed">Feed</a>'
          following_link = '<a href="#seguidos" data-nav="following">Seguindo</a>'
          if 'href="#seguidos"' not in text and feed in text:
              text = text.replace(feed, feed + '\n        ' + following_link)

          # Add the following list panel once, immediately before the existing main.js script.
          section = '''
    <!-- ============ SEGUINDO ============ -->
    <section class="section following" id="seguidos" aria-labelledby="followingTitle">
      <div class="container">
        <div class="section__head">
          <span class="section__eyebrow">MINHA REDE</span>
          <h2 class="section__title" id="followingTitle">Seguindo <span id="followingCount">0</span></h2>
          <p class="section__text">Veja os criadores que você escolheu acompanhar no PULSO.</p>
        </div>
        <div id="followingList" class="following__list" aria-live="polite"></div>
      </div>
    </section>
'''
          if 'id="followingList"' not in text:
              marker = '  <script src="assets/js/main.js" defer></script>'
              if marker not in text:
                  raise SystemExit('main.js script tag not found')
              text = text.replace(marker, section + '\n' + '  <script src="assets/js/follow.js" defer></script>\n  <script src="assets/js/seguidos.js" defer></script>\n' + marker, 1)
          else:
              if 'assets/js/seguidos.js' not in text:
                  marker = '  <script src="assets/js/main.js" defer></script>'
                  text = text.replace(marker, '  <script src="assets/js/seguidos.js" defer></script>\n' + marker, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Add following styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/styles.css')
          text = p.read_text(encoding='utf-8')
          css = '''

/* PULSO — Seguindo */
.following { padding: 96px 0; }
.following__list { display: grid; gap: 14px; max-width: 820px; margin-top: 32px; }
.following__item { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid rgba(255,255,255,.10); border-radius: 18px; background: rgba(255,255,255,.045); backdrop-filter: blur(12px); }
.following__avatar { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: rgba(255,255,255,.10); }
.following__meta { min-width: 0; flex: 1; }
.following__name { display: block; font-weight: 700; }
.following__handle { display: block; margin-top: 3px; opacity: .62; font-size: .9rem; }
.following__button { border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 15px; background: transparent; color: inherit; cursor: pointer; font: inherit; font-weight: 700; }
.following__empty { padding: 28px; border: 1px dashed rgba(255,255,255,.15); border-radius: 18px; opacity: .72; }
.following__count { opacity: .65; font-size: .7em; }
'''
          if '/* PULSO — Seguindo */' not in text:
              p.write_text(text + css, encoding='utf-8')
          PY

      - name: Commit connection
        run: |
          git config user.name 'PULSO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/css/styles.css
          git diff --cached --quiet || git commit -m 'feat: add following list to PULSO'
          git push
