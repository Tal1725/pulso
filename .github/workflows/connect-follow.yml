name: Connect PULSO follow system

on:
  push:
    paths:
      - '.github/workflows/connect-follow.yml'
      - 'assets/js/follow.js'

permissions:
  contents: write

jobs:
  connect-follow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect persistent follow script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '  <script src="assets/js/follow.js" defer></script>\n'
          if 'assets/js/follow.js' not in text:
              marker = '  <script src="assets/js/main.js" defer></script>'
              if marker not in text:
                  raise SystemExit('main.js script tag not found')
              text = text.replace(marker, tag + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit connection
        run: |
          git config user.name 'PULSO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: connect persistent follow system'
          git push
