name: PULSO smoke test

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required pages and assets
        run: |
          set -e
          test -f index.html
          test -f app.html
          test -f entrar.html
          test -f cadastro.html
          test -f assets/img/logo.svg
          grep -q 'assets/js/app.js' app.html
          grep -q 'assets/js/pulso-publish-final.js' app.html
          grep -q 'assets/js/notifications.js' app.html
          echo "HTML/assets OK"
      - name: Syntax-check JavaScript modules
        run: |
          set -e
          for f in assets/js/app.js assets/js/auth.js assets/js/login.js assets/js/pulso-publish-final.js assets/js/pulso-profiles.js assets/js/notifications.js assets/js/share.js assets/js/media.js assets/js/messages.js; do
            node --check "$f"
          done
          echo "Core JavaScript syntax OK"
      - name: Check for removed Mini Avatar IA references
        run: |
          if grep -RniE 'mini.?avatar|avatar.?ia|network.?avatar' app.html assets/js assets/css --exclude='pulso-ia*.js' --exclude='ai.js' --exclude='ai.css'; then
            echo "WARNING: legacy Mini Avatar references remain in source"
          else
            echo "Mini Avatar IA references not found in app source"
          fi
