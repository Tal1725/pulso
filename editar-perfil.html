<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSO — Editar perfil</title><style>body{margin:0;font-family:system-ui;background:#0b0b0e;color:#fff;padding:20px}.card{max-width:520px;margin:20px auto;background:#17171b;border-radius:20px;padding:22px}label{display:block;font-weight:700;margin:14px 0}input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border-radius:10px;border:1px solid #444;background:#0f1013;color:#fff}button{width:100%;padding:13px;border:0;border-radius:11px;margin-top:10px;font-weight:800;background:#ff3d7e;color:#fff}.back{background:#303038}.msg{margin-top:12px;color:#cfd2df}.photo{width:90px;height:90px;border-radius:50%;overflow:hidden;background:#333;display:grid;place-items:center;font-size:32px;font-weight:900;margin-bottom:8px}.photo img{width:100%;height:100%;object-fit:cover}</style></head><body><div class="card"><h1>Editar meu perfil</h1><div id="status">Carregando...</div><div id="form" hidden><div id="photo" class="photo">?</div><label>Foto<input id="file" type="file" accept="image/*"></label><label>Nome<input id="name" maxlength="80"></label><label>Usuário<input id="username" maxlength="40"></label><label>Bio<textarea id="bio" maxlength="280" rows="4"></textarea></label><label>Status<input id="userstatus" maxlength="160"></label><button id="save">Salvar perfil</button><button class="back" onclick="location.href='app.html'">Voltar ao PULSO</button><div id="msg" class="msg"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const sb=createClient('https://vqpavcyehgdifbtvzhcn.supabase.co','sb_publishable_915zO84U7fk0ZAjE4vdsFQ_yRWDA6Cm',{auth:{persistSession:true,autoRefreshToken:true}});let uid=null;const $=id=>document.getElementById(id);async function init(){const{data}=await sb.auth.getSession();uid=data.session?.user?.id;if(!uid){$('status').textContent='Sua sessão não está ativa. Entre novamente no PULSO.';return}const{data:p,error}=await sb.from('profiles').select('display_name,username,bio,status,avatar_url').eq('id',uid).maybeSingle();if(error){$('status').textContent=error.message;return}if(!p){$('status').textContent='Perfil não encontrado.';return}$('status').textContent='';$('form').hidden=false;$('name').value=p.display_name||'';$('username').value=p.username||'';$('bio').value=p.bio||'';$('userstatus').value=p.status||'';if(p.avatar_url)$('photo').innerHTML='<img src="'+p.avatar_url+'">';else $('photo').textContent=(p.display_name||'?')[0].toUpperCase()}$('file').onchange=()=>{const f=$('file').files[0];if(f)$('photo').innerHTML='<img src="'+URL.createObjectURL(f)+'">'};$('save').onclick=async()=>{const b=$('save');b.disabled=true;$('msg').textContent='Salvando...';try{const name=$('name').value.trim(),username=$('username').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');if(name.length<2)throw Error('Informe seu nome.');if(username.length<3)throw Error('Usuário precisa ter 3 caracteres ou mais.');let avatar_url=null;const old=await sb.from('profiles').select('avatar_url').eq('id',uid).maybeSingle();avatar_url=old.data?.avatar_url||null;const file=$('file').files[0];if(file){if(file.size>5242880)throw Error('A foto deve ter no máximo 5 MB.');const ext=(file.type.split('/')[1]||'jpg').replace('jpeg','jpg'),path=uid+'/profile-'+Date.now()+'.'+ext;const up=await sb.storage.from('pulso-avatars').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;avatar_url=sb.storage.from('pulso-avatars').getPublicUrl(path).data.publicUrl}const{error}=await sb.from('profiles').update({display_name:name,username,bio:$('bio').value.trim(),status:$('userstatus').value.trim(),avatar_url}).eq('id',uid);if(error)throw error;$('msg').textContent='Perfil atualizado com sucesso!';setTimeout(()=>location.href='app.html',700)}catch(e){$('msg').textContent=e.message||'Erro ao salvar'}finally{b.disabled=false}};init();</script></body></html>
