<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — PULSO</title><meta name="description" content="Entre no PULSO e participe da nova experiência social de vídeos curtos."><link rel="icon" href="assets/img/favicon.svg"><link rel="stylesheet" href="assets/css/auth.css?v=20260909a"></head><body><div class="auth-bg" aria-hidden="true"></div><main class="auth-card"><a class="brand" href="./"><img src="assets/img/logo.svg" alt="PULSO"><span>PULSO</span></a><p class="eyebrow">Volte para o ritmo</p><h1 class="title" id="authTitle">Entrar no PULSO</h1><p class="subtitle" id="authSubtitle">Acesse seu perfil, descubra vídeos e participe da comunidade.</p><div class="social-login" id="socialLogin"><button type="button" class="social-btn google" data-social-provider="google"><span>G</span> Continuar com Google</button><button type="button" class="social-btn facebook" data-social-provider="facebook"><span>f</span> Continuar com Facebook</button><button type="button" class="social-btn x" data-social-provider="twitter"><span>𝕏</span> Continuar com X</button></div><div class="divider" id="loginDivider"><span>ou entre com e-mail</span></div><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="voce@email.com"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></div><button class="btn" id="submitBtn">Entrar</button><div class="message" id="message" role="status"></div></form><div id="socialMessage" class="social-message" role="status"></div><a class="back" id="forgotLink" href="#">Esqueci minha senha</a><a class="back" href="cadastro.html">Ainda não tenho conta → Criar conta</a><a class="back" href="./">← Voltar para o PULSO</a><div class="footer-note">PULSO — O ritmo é seu. O momento é agora
