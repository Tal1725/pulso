<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectando Pollinations — PULSO</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090d;color:#fff;font-family:Arial,sans-serif}.box{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #252938;border-radius:20px;background:#11131a;text-align:center}h1{font-size:22px}p{color:#b9bdd0;line-height:1.5}.ok{color:#72e6a1}.err{color:#ff7d92}</style></head><body><main class="box"><h1>✨ Conectando a IA do PULSO</h1><p id="msg">Validando sua autorização Pollinations…</p></main><script>
const TOKEN='pulso_pollinations_access_token',EXP='pulso_pollinations_token_exp',VER='pulso_pollinations_pkce_verifier',STATE='pulso_pollinations_state',APP='pulso_pollinations_app_key';
const REDIRECT='https://tal1725.github.io/pulso/pollinations-callback.html';
function fail(t){document.getElementById('msg').className='err';document.getElementById('msg').textContent=t+' Você pode fechar esta página e tentar conectar novamente no PULSO.'}
(async()=>{try{const q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state'),saved=sessionStorage.getItem(STATE),verifier=sessionStorage.getItem(VER),client=localStorage.getItem(APP);if(q.get('error'))return fail('A autorização foi cancelada.');if(!code||!state||!saved||state!==saved)return fail('Não foi possível validar a autorização (state inválido).');if(!verifier||!client)return fail('Dados de autorização ausentes.');const r=await fetch('https://enter.pollinations.ai/api/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,client_id:client,redirect_uri:REDIRECT,code_verifier:verifier})});const data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.error_description||data.error||'token inválido');sessionStorage.setItem(TOKEN,data.access_token);sessionStorage.setItem(EXP,String(Date.now()+Number(data.expires_in||604800)*1000));sessionStorage.removeItem(VER);sessionStorage.removeItem(STATE);history.replaceState({},document.title,REDIRECT);document.getElementById('msg').className='ok';document.getElementById('msg').textContent='Autorização concluída. Voltando ao PULSO…';setTimeout(()=>location.replace('./app.html'),700)}catch(e){console.error(e);fail('Não foi possível concluir a conexão: '+e.message)}})();
</script></body></html>
