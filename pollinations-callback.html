<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectando IA — PULSO</title></head><body><p style="font-family:system-ui;text-align:center;padding:40px">Conectando a IA do PULSO…</p><script>
const TOKEN='pulso_pollinations_access_token',EXP='pulso_pollinations_token_exp',VER='pulso_pollinations_pkce_verifier',STATE='pulso_pollinations_state',APP='pulso_pollinations_app_key';
(async()=>{try{const q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state'),err=q.get('error');if(err)throw new Error(q.get('error_description')||err);if(!code)throw new Error('Código de autorização ausente.');if(state!==sessionStorage.getItem(STATE))throw new Error('Autorização inválida.');const client=localStorage.getItem(APP),verifier=sessionStorage.getItem(VER);if(!client||!verifier)throw new Error('Sessão de autorização não encontrada.');const r=await fetch('https://enter.pollinations.ai/api/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,client_id:client,redirect_uri:'https://tal1725.github.io/pulso/pollinations-callback.html',code_verifier:verifier})});const data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.error_description||data.error||'Não foi possível concluir a autorização.');sessionStorage.setItem(TOKEN,data.access_token);if(data.expires_in)sessionStorage.setItem(EXP,String(Date.now()+Number(data.expires_in)*1000));else sessionStorage.setItem(EXP,String(Date.now()+7*86400000));sessionStorage.removeItem(VER);sessionStorage.removeItem(STATE);location.replace('./app.html')}catch(e){document.body.innerHTML='<p style="font-family:system-ui;text-align:center;padding:40px">Não foi possível conectar a IA.<br><small>'+String(e.message).replace(/[<>]/g,'')+'</small><br><br><a href="./app.html">Voltar ao PULSO</a></p>'}})();
</script></body></html>
