<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090912">
<title>PULSO — Teste de tela cheia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090912}
body{font-family:system-ui,-apple-system,sans-serif;touch-action:pan-y}
.stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#090912;overflow:hidden}
.media{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 20%,transparent 75%,rgba(0,0,0,.12))}
@media (min-width:700px){body{display:grid;place-items:center;background:#171722}.stage{position:relative;width:min(100vw,430px);height:min(100dvh,930px);border-radius:28px;box-shadow:0 0 0 1px #ffffff20,0 20px 90px #0009}}
</style>
</head>
<body>
<main class="stage" aria-label="Demonstração PULSO: publicação em tela cheia">
<img class="media" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&h=2200&q=85" alt="Imagem de demonstração em tela cheia">
<div class="shade"></div>
</main>
<script>
let startX=0,startY=0;
document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;const dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>90||dy>100)location.href='app.html'},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')location.href='app.html'});
</script>
</body>
</html>
