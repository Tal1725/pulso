<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090912">
<title>PULSO — Teste completo de tela cheia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090912}body{font-family:system-ui,-apple-system,sans-serif;touch-action:none}.stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#090912;overflow:hidden}.media{display:block;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 20%,transparent 75%,rgba(0,0,0,.12))}.hint{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 12px;border-radius:20px;background:#0006;color:#fff;font-size:12px;white-space:nowrap;opacity:1;transition:opacity .5s;pointer-events:none}.hint.hide{opacity:0}@media(min-width:700px){body{display:grid;place-items:center;background:#171722}.stage{position:relative;width:min(100vw,430px);height:min(100dvh,930px);border-radius:28px;box-shadow:0 0 0 1px #ffffff20,0 20px 90px #0009}}
</style>
</head>
<body><main class="stage" aria-label="Demonstração PULSO: publicações em tela cheia"><img id="media" class="media" alt="Publicação de demonstração em tela cheia" draggable="false"><div class="shade"></div><div id="hint" class="hint">Deslize para cima ou para baixo para trocar a publicação</div></main>
<script>
const posts=[
{src:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&h=2200&q=85',alt:'Exemplo de retrato'},
{src:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&h=2200&q=85',alt:'Exemplo de paisagem'},
{src:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&h=2200&q=85',alt:'Exemplo de mar'}
];
let index=0,sx=0,sy=0,changing=false;
const media=document.getElementById('media'),hint=document.getElementById('hint');
function show(i){index=(i+posts.length)%posts.length;media.src=posts[index].src;media.alt=posts[index].alt;changing=false}
show(0);
let hintTimer=setTimeout(()=>hint.classList.add('hide'),4500);
document.addEventListener('touchstart',e=>{if(!e.changedTouches.length)return;sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>35&&Math.abs(dy)>Math.abs(dx)){show(dy<0?index+1:index-1)}},{passive:true});
document.addEventListener('wheel',e=>{if(changing)return;changing=true;show(e.deltaY>0?index+1:index-1)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();show(index+1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();show(index-1)}else if(e.key==='Escape'||e.key==='Backspace'){location.href='app.html'}});
</script>
</body></html>
